<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Misterioso 🔡</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3069/3069172.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #7b2cbf; --secondary: #ff9e00; }

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(ellipse at 20% 30%, rgba(123,44,191,0.4) 0%, transparent 55%),
                        radial-gradient(ellipse at 80% 70%, rgba(0,80,200,0.3) 0%, transparent 55%),
                        #0a001a;
            color: white;
            min-height: 100vh;
            padding: 16px;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            padding: 24px 20px;
            text-align: center;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: white; text-decoration: none;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px; padding: 9px 18px;
            font-size: 0.95rem; font-family: 'Fredoka', sans-serif; transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .pts-badge {
            background: rgba(255,158,0,0.2); border: 1px solid var(--secondary);
            border-radius: 30px; padding: 8px 18px;
            font-family: 'Fredoka', sans-serif; font-size: 1rem; color: var(--secondary);
        }

        h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2rem;
            background: linear-gradient(90deg, #d4aaff, #ffcc80);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .subtitle { color: rgba(255,255,255,0.55); font-size: 0.9rem; margin-bottom: 18px; }

        .rocket {
            font-size: 4rem; margin: 10px 0; display: block;
            transition: all 0.4s;
        }

        .lives-row { display: flex; justify-content: center; gap: 8px; margin: 10px 0 18px; }
        .life-dot {
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--secondary); box-shadow: 0 0 8px var(--secondary);
            transition: all 0.4s;
        }
        .life-dot.lost { background: rgba(255,255,255,0.12); box-shadow: none; }

        .category { color: rgba(255,255,255,0.5); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }

        .word-row {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 16px auto;
        }
        .letter-box {
            width: 38px; height: 50px;
            border-bottom: 4px solid rgba(255,255,255,0.45);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-family: 'Fredoka', sans-serif; font-weight: 700;
            color: var(--secondary); transition: all 0.3s;
        }
        .letter-box.space { border: none; width: 18px; }
        .letter-box.reveal { border-color: #2ecc71; }

        .keyboard {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
            max-width: 420px; margin: 16px auto 0;
        }
        .key {
            width: 38px; height: 40px; border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.08);
            color: white; font-size: 1rem;
            font-family: 'Fredoka', sans-serif; cursor: pointer; transition: all 0.18s;
        }
        .key:hover:not(:disabled) { background: rgba(123,44,191,0.35); border-color: var(--primary); transform: scale(1.08); }
        .key:disabled { opacity: 0.3; cursor: default; }
        .key.correct { background: rgba(46,204,113,0.3); border-color: #2ecc71; color: #2ecc71; }
        .key.wrong   { background: rgba(231,76,60,0.2);  border-color: #e74c3c; color: #e74c3c; }

        .result { font-family: 'Fredoka', sans-serif; font-size: 1.7rem; margin-top: 18px; min-height: 44px; }
        .result.win  { color: #2ecc71; text-shadow: 0 0 10px rgba(46,204,113,0.4); }
        .result.lose { color: #e74c3c; }

        .btn-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        .btn-next {
            padding: 11px 26px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, #7b2cbf, #5c35d4);
            color: white; font-family: 'Fredoka', sans-serif; font-size: 1rem;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(123,44,191,0.5); }

        @media (max-width: 400px) {
            .letter-box { width: 30px; height: 42px; font-size: 1.4rem; }
            .key { width: 33px; height: 36px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="topbar">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Base Espacial</a>
        <div class="pts-badge">⭐ <span id="pts">0</span> pts</div>
    </div>

    <h1>🔡 Planeta Misterioso</h1>
    <p class="subtitle">Adivina la palabra letra por letra. ¡Tienes 6 intentos!</p>

    <span class="rocket" id="rocket">🚀</span>

    <div class="lives-row" id="livesRow"></div>

    <p class="category" id="category">Categoría: ?</p>
    <div class="word-row" id="wordRow"></div>
    <div class="keyboard" id="keyboard"></div>

    <div class="result" id="result"></div>

    <div class="btn-row" id="btnRow" style="display:none">
        <button class="btn-next" id="nextBtn"><i class="fa-solid fa-rotate-right"></i> Nueva Palabra</button>
        <a href="index.html" class="btn-next" style="text-decoration:none; background: rgba(255,255,255,0.15);">
            <i class="fa-solid fa-house"></i> Inicio
        </a>
    </div>
</div>

<script>
function getScore() {
    try { return Object.values(JSON.parse(sessionStorage.getItem('astronautScores')||'{}')).reduce((a,b)=>a+b,0); }
    catch(e){ return 0; }
}
function addPoints(pts) {
    try {
        const s = JSON.parse(sessionStorage.getItem('astronautScores')||'{}');
        s.ahorcado = (s.ahorcado||0) + pts;
        sessionStorage.setItem('astronautScores', JSON.stringify(s));
        document.getElementById('pts').textContent = getScore();
    } catch(e){}
}
document.getElementById('pts').textContent = getScore();

const WORDS = [
    { cat: 'Espacio',    word: 'ASTRONAUTA' },
    { cat: 'Planeta',    word: 'JUPITER' },
    { cat: 'Ciencia',    word: 'GRAVEDAD' },
    { cat: 'Espacio',    word: 'SATELITE' },
    { cat: 'Vehículo',   word: 'COHETE' },
    { cat: 'Ciencia',    word: 'OXIGENO' },
    { cat: 'Animal',     word: 'AGUILA' },
    { cat: 'Naturaleza', word: 'VOLCAN' },
    { cat: 'Planeta',    word: 'MERCURIO' },
    { cat: 'Espacio',    word: 'NEBULOSA' },
    { cat: 'Espacio',    word: 'GALAXIA' },
    { cat: 'Ciencia',    word: 'FOTOSINTESIS' },
];

const ROCKETS = ['💥','🔥','☄️','🛸','🛰️','🚀✨','🚀✨'];

const MAX = 6;
let cur = null, guessed = [], lives = MAX, over = false;

function init() {
    over = false; guessed = []; lives = MAX;
    document.getElementById('result').textContent = '';
    document.getElementById('result').className = 'result';
    document.getElementById('btnRow').style.display = 'none';
    document.getElementById('rocket').textContent = ROCKETS[lives];
    document.getElementById('rocket').style.transform = 'none';
    cur = WORDS[Math.floor(Math.random() * WORDS.length)];
    document.getElementById('category').textContent = 'Pista: ' + cur.cat;
    drawLives(); drawWord(); drawKeyboard();
}

function drawLives() {
    const row = document.getElementById('livesRow');
    row.innerHTML = '';
    for (let i = 0; i < MAX; i++) {
        const d = document.createElement('div');
        d.className = 'life-dot' + (i >= lives ? ' lost' : '');
        row.appendChild(d);
    }
}

function drawWord() {
    const row = document.getElementById('wordRow');
    row.innerHTML = '';
    cur.word.split('').forEach(ch => {
        const b = document.createElement('div');
        if (ch === ' ') { b.className = 'letter-box space'; }
        else {
            b.className = 'letter-box' + (guessed.includes(ch) ? ' reveal' : '');
            b.textContent = guessed.includes(ch) ? ch : '';
        }
        row.appendChild(b);
    });
}

function drawKeyboard() {
    const kb = document.getElementById('keyboard');
    kb.innerHTML = '';
    'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'key';
        btn.textContent = ch;
        const used = guessed.includes(ch);
        if (used) {
            btn.disabled = true;
            btn.classList.add(cur.word.includes(ch) ? 'correct' : 'wrong');
        }
        btn.addEventListener('click', () => guess(ch));
        kb.appendChild(btn);
    });
}

function guess(ch) {
    if (over || guessed.includes(ch)) return;
    guessed.push(ch);
    if (cur.word.includes(ch)) {
        drawWord(); drawKeyboard(); checkWin();
    } else {
        lives--;
        document.getElementById('rocket').textContent = ROCKETS[lives];
        document.getElementById('rocket').style.transform = `rotate(${(MAX-lives)*15}deg)`;
        setTimeout(()=>document.getElementById('rocket').style.transform='none',350);
        drawLives(); drawKeyboard(); checkLose();
    }
}

function checkWin() {
    if (cur.word.split('').filter(c=>c!==' ').every(c=>guessed.includes(c))) {
        over = true;
        const r = document.getElementById('result');
        r.textContent = '¡Palabra descubierta! +30 Puntos ⭐';
        r.className = 'result win';
        document.getElementById('btnRow').style.display = 'flex';
        document.getElementById('rocket').style.transform = 'translateY(-20px) scale(1.2)';
        addPoints(30);
    }
}

function checkLose() {
    if (lives <= 0) {
        over = true;
        // Revelar palabra
        const row = document.getElementById('wordRow');
        row.innerHTML = '';
        cur.word.split('').forEach(ch => {
            const b = document.createElement('div');
            b.className = ch===' ' ? 'letter-box space' : 'letter-box reveal';
            if (ch!==' ') { b.textContent = ch; if (!guessed.includes(ch)) b.style.color='#e74c3c'; }
            row.appendChild(b);
        });
        const r = document.getElementById('result');
        r.textContent = '¡Oh no! Era: ' + cur.word;
        r.className = 'result lose';
        document.getElementById('btnRow').style.display = 'flex';
    }
}

document.getElementById('nextBtn').addEventListener('click', init);

document.addEventListener('keydown', e => {
    if (over) return;
    const k = e.key.toUpperCase();
    if (/^[A-Z]$/.test(k)) guess(k);
});

init();
</script>
</body>
</html>
