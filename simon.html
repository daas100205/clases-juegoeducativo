<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secuencia Estelar 🎵</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3069/3069172.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7b2cbf;
            --secondary: #ff9e00;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(ellipse at 20% 30%, rgba(123, 44, 191, 0.4) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 80, 200, 0.3) 0%, transparent 55%),
                #0a001a;
            color: white;
            min-height: 100vh;
            padding: 16px;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 24px 20px;
            text-align: center;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 9px 18px;
            font-size: 0.95rem;
            font-family: 'Fredoka', sans-serif;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .pts-badge {
            background: rgba(255, 158, 0, 0.2);
            border: 1px solid var(--secondary);
            border-radius: 30px;
            padding: 8px 18px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            color: var(--secondary);
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            background: linear-gradient(90deg, #d4aaff, #ffcc80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Estilos del juego */
        .simon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .simon-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 30px;
        }

        /* Center control hub */
        .simon-board::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: #1a0033;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .simon-pad {
            width: 100%;
            height: 100%;
            border-radius: 100%;
            cursor: pointer;
            transition: all 0.1s;
            opacity: 0.6;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .simon-pad::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, transparent 50%);
            border-radius: inherit;
        }

        /* Colores vivos para los pads */
        #pad-0 {
            background-color: #ff3366;
            border-top-left-radius: 100%;
            border-bottom-right-radius: 20px;
        }

        #pad-1 {
            background-color: #33ccff;
            border-top-right-radius: 100%;
            border-bottom-left-radius: 20px;
        }

        #pad-2 {
            background-color: #ffcc00;
            border-bottom-left-radius: 100%;
            border-top-right-radius: 20px;
        }

        #pad-3 {
            background-color: #00ff66;
            border-bottom-right-radius: 100%;
            border-top-left-radius: 20px;
        }

        .simon-pad.active {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 0 40px currentColor;
            z-index: 5;
        }

        #pad-0.active {
            box-shadow: 0 0 40px #ff3366;
        }

        #pad-1.active {
            box-shadow: 0 0 40px #33ccff;
        }

        #pad-2.active {
            box-shadow: 0 0 40px #ffcc00;
        }

        #pad-3.active {
            box-shadow: 0 0 40px #00ff66;
        }

        .error-shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-10px);
            }

            40% {
                transform: translateX(10px);
            }

            60% {
                transform: translateX(-10px);
            }

            80% {
                transform: translateX(10px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .level-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: 'Fredoka', sans-serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .message-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
        }

        .start-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #7b2cbf, #5c35d4);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .start-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 44, 191, 0.5);
        }

        .start-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 400px) {
            .simon-board {
                width: 280px;
                height: 280px;
                padding: 20px;
            }

            .simon-board::after {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="topbar">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Base Espacial</a>
            <div class="pts-badge">⭐ <span id="gameScore">0</span> pts</div>
        </div>

        <h1> Secuencia Estelar</h1>
        <p class="subtitle">¡El panel de control alienígena se ha activado! Memoriza el orden en que se iluminan los
            botones y repítelo para ganar estrellas.</p>

        <div class="simon-container">
            <div id="gameMessage" class="message-box">
                Presiona "Iniciar Secuencia" para jugar.
            </div>

            <div class="simon-board" id="simonBoard">
                <div class="level-display" id="levelDisplay">-</div>
                <div class="simon-pad" id="pad-0" data-pad="0"></div>
                <div class="simon-pad" id="pad-1" data-pad="1"></div>
                <div class="simon-pad" id="pad-2" data-pad="2"></div>
                <div class="simon-pad" id="pad-3" data-pad="3"></div>
            </div>

            <button id="startSimonBtn" class="start-btn"><i class="fa-solid fa-play"></i> Iniciar Secuencia</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/simon.js"></script>
</body>

</html>
