<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta de los Acertijos - Crucigrama</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3069/3069172.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(123, 44, 191, 0.35) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 80, 200, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 0, 30, 1) 0%, #0a001a 100%);
        }

        .game-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px;
            margin-top: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        .points-badge {
            font-size: 1.1rem;
        }

        .content-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* Tablero */
        .board {
            display: grid;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(123, 44, 191, 0.4);
            gap: 2px;
        }

        .cell-wrapper {
            position: relative;
            width: 38px;
            height: 38px;
        }

        .cell-num {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 0.55rem;
            color: var(--primary-color);
            z-index: 2;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
        }

        .cell {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            text-transform: uppercase;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            outline: none;
            transition: all 0.2s;
            caret-color: transparent;
        }

        .cell:focus {
            background: #eef0ff;
            border-color: var(--primary-color);
            box-shadow: inset 0 0 0 2px rgba(123, 44, 191, 0.3);
        }

        .cell.correct {
            background: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
            pointer-events: none;
        }

        .cell.wrong-input {
            background: #fde8e8 !important;
            border-color: #e74c3c !important;
            animation: shake 0.4s;
        }

        .cell.empty {
            background: rgba(10, 0, 26, 0.9);
            border: none;
            pointer-events: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        /* Pistas */
        .clues-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 25px;
            border-radius: 15px;
            min-width: 260px;
            max-width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clues-container .section-title {
            color: var(--secondary-color);
            font-size: 1.2rem;
            margin-bottom: 12px;
            font-family: 'Fredoka', sans-serif;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 6px;
        }

        .clue-list {
            margin-bottom: 20px;
        }

        .clue-item {
            font-size: 0.95rem;
            margin-bottom: 8px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.85);
        }

        .clue-item span {
            font-weight: 800;
            color: var(--secondary-color);
            margin-right: 4px;
        }

        #feedbackCrucigrama {
            min-height: 24px;
            font-size: 0.95rem;
            margin-top: 10px;
            font-family: 'Fredoka', sans-serif;
        }

        .check-btn {
            margin-top: 15px;
            width: 100%;
        }

        .win-message {
            text-align: center;
            margin-top: 25px;
        }

        @media (max-width: 768px) {
            .cell-wrapper {
                width: 28px;
                height: 28px;
            }

            .cell {
                font-size: 0.9rem;
            }

            .cell-num {
                font-size: 0.45rem;
            }

            .clues-container {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="game-wrapper glass-panel">
        <div class="top-bar">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Base Espacial</a>
            <div class="points-badge">⭐ <span id="gameScore" class="score-number">0</span> pts</div>
        </div>

        <h1 class="title-glow" style="margin-bottom: 5px; font-size: 2rem;">Crucigrama Espacial</h1>
        <p style="text-align:center; color:rgba(255,255,255,0.65); margin-bottom: 20px;">Lee las pistas y completa las
            palabras. ¡Presiona Verificar cuando termines!</p>

        <div class="content-wrapper">
            <!-- Pistas a la izquierda -->
            <div class="clues-container">
                <div class="clue-list" id="horizontalClues">
                    <p class="section-title">➡️ Horizontales</p>
                </div>
                <div class="clue-list" id="verticalClues">
                    <p class="section-title">⬇️ Verticales</p>
                </div>
                <div id="feedbackCrucigrama"></div>
                <button id="checkBtn" class="btn-primary check-btn">
                    <i class="fa-solid fa-check-circle"></i> Verificar
                </button>
            </div>

            <!-- Tablero a la derecha -->
            <div id="board" class="board"></div>
        </div>

        <div id="winMessage" class="win-message win-message">
            ¡Crucigrama Completado! +40 Puntos
            <br>
            <button class="btn-primary" style="margin-top: 15px;" onclick="location.reload()">
                <i class="fa-solid fa-rotate-right"></i> Jugar Otro
            </button>
            <a href="index.html" class="btn-secondary"
                style="display:inline-block; margin-top: 10px; text-decoration:none;">
                <i class="fa-solid fa-house"></i> Volver a la Base
            </a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/crucigrama.js"></script>
</body>

</html>
